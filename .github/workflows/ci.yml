name: CI

on:
  push:
  pull_request:

jobs:
  addon-lint:
    name: add-on lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./claude_code"

  smoke:
    name: build + read-only smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t claude-code-addon:ci claude_code
      - run: tests/smoke.sh claude-code-addon:ci

  build-aarch64:
    name: build (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t claude-code-addon:arm claude_code
